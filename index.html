function done(t,n,sub,after){snd();var d=document.createElement("div");d.className="full dn";d.innerHTML='<div class="ring"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="'+P.check+'"/></svg></div><h2 style="margin:22px 0 6px">'+t+'</h2><div style="font-size:44px;font-weight:800;letter-spacing:-1px">'+yen(n)+'</div><p style="opacity:.9;margin:8px 0 28px">'+sub+" ・ "+now()+'</p><button class="btn" id="ok">閉じる</button>';document.body.appendChild(d);d.querySelector("#ok").onclick=function(){d.remove();go("home")}}
function found(){if(view!="scan")return;if(!pending){toast("読み取れるQRがありません");go("pay");return}view="confirm";render()}
function mk(){var n=+amt;if(!n)return toast("金額を入力してください");pending={id:"T"+Date.now()+"-"+n,amt:n,shop:S.shop};amt="";render()}
function pay(){var p=pending;if(!p)return;if(S.cardOn===false)return toast("支払いがロック中です。カード画面で解除してください");var o=cpOff(p),tot=p.amt-o.off;if(S.bal<tot)return toast("残高が不足しています。チャージしてください");
 var pt=Math.floor(tot*.005)*(o.c&&o.c.k=="x"?2:1);S.bal-=tot;S.pts+=pt;if(o.c)o.c.used=true;useCp=0;if(!p.ext)S.sales+=tot;
 S.hist.unshift({t:(p.shop||S.shop)+(o.off?"（クーポン−"+yen(o.off)+"）":""),i:"qr",d:-tot,ts:now()});if(!p.ext)S.sh.unshift({t:"QR決済の入金",i:"qr",d:tot,ts:now()});pending=null;nt("お支払い "+yen(tot)+" が完了しました（+"+pt+"P）");save();
 done("支払いが完了しました",tot,"+"+pt+"P 獲得")}
function charge(){var n=+amt;if(!n)return toast("金額を入力してください");S.bal+=n;S.hist.unshift({t:"チャージ（"+meth+"）",i:"plus",d:n,ts:now()});nt("チャージ "+yen(n)+" が完了しました");save();done("チャージが完了しました",n,"残高 "+yen(S.bal))}
function send(){var n=+amt;if(!to.trim())return toast("送り先を入力してください");if(!n)return toast("金額を入力してください");if(S.bal<n)return toast("残高が不足しています");
 S.bal-=n;S.hist.unshift({t:to.trim()+" さんへ送金",i:"user",d:-n,ts:now()});nt(to.trim()+" さんへ "+yen(n)+" を送金しました");save();var w=to.trim();to="";done("送金が完了しました",n,w+" さん宛")}
